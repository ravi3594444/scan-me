:root {

#world { position: absolute; left: 0; top: 0; width: 1440px; height: 1440px; transform-origin: 0 0; }
.abs { position: absolute; left: 0; top: 0; }
.scene { position: absolute; left: 0; top: 0; width: 1440px; height: 1440px; transform-origin: 0 0; }
.cover { position: absolute; display: block; max-width: none; }
.clip { position: absolute; overflow: hidden; }

/* wordmark */
.wm-l { position: absolute; top: 0; font: 800 170px Archivo; font-stretch: 125%; line-height: 1; white-space: pre; color: var(--ink); transform-origin: 0 0; }
.black { position: absolute; background: var(--ink); overflow: hidden; }

.tile { position: absolute; overflow: hidden; background: #d9d4ca; }

/* liquid glass */
.glass { position: absolute; overflow: hidden; transform-origin: 50% 50%;
  box-shadow: 0 14px 34px rgba(24, 18, 10, .20), 0 2px 7px rgba(24, 18, 10, .12); }
.glass-refr { position: absolute; left: 0; top: 0; overflow: hidden; }
.glass-bd { position: absolute; left: 0; top: 0; transform-origin: 0 0; filter: saturate(1.4) brightness(1.07) contrast(1.02); }
.glass-tint { position: absolute; inset: 0; background: rgba(255, 255, 255, .07); }
.glass-rim { position: absolute; inset: 0; border-radius: inherit; padding: 1.6px;
  background: conic-gradient(from 200deg, rgba(255,255,255,.95), rgba(255,255,255,.18) 22%, rgba(255,255,255,.08) 34%, rgba(255,255,255,.62) 52%, rgba(255,255,255,.14) 70%, rgba(255,255,255,.10) 82%, rgba(255,255,255,.95));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
.glass-sheen { position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,0) 42%); }
.gg-wrap { position: absolute; transform-origin: 50% 50%; }
.gg-wrap.shadow { filter: drop-shadow(0 8px 16px rgba(20, 14, 6, .22)); }
.gg { position: absolute; left: 0; top: 0; overflow: hidden; -webkit-mask-size: 100% 100%; mask-size: 100% 100%; }
.gg-hl { position: absolute; inset: 0; background-size: 100% 100%; }

#cursor { position: absolute; left: 0; top: 0; width: 34px; height: 50px; transform-origin: 0 0; filter: drop-shadow(0 2px 3px rgba(0,0,0,.28)); z-index: 50; }

.ui { font-family: var(--ui); position: absolute; white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }

'use strict';
// ============================================================================
// time
// ============================================================================
const BEAT = 0.5;                 // 120 BPM

// Closed-form step response of a damped spring, 0 -> 1, starting at t = 0.

const SP = {
  ui:    { w: 20, z: 0.86 },
  snap:  { w: 17, z: 0.56 },
  pop:   { w: 24, z: 0.46 },
  firm:  { w: 26, z: 0.9 },
  soft:  { w: 10, z: 0.96 },
  cam:   { w: 9,  z: 1.0 },
  drag:  { w: 8,  z: 1.0 },
  crit:  { w: 16, z: 1.0 },

  p6: { src: 'assets/photos/px-35260667.jpg', fx: .5, fy: .5 },

}

  const p = PHOTOS[key];
  const im = el('img', 'cover', parent, { transformOrigin: '0 0' }); im.src = p.src; im.draggable = false;
  box(im, 0, 0, p.w, p.h);

// so a slow resize would resample the whole image at once each time its rounded size flips

  const p = PHOTOS[key], r = cover(p, bw, bh, zoom);

// ============================================================================
// liquid glass: every glass element holds its own clone of the scene behind it,
// refracted through an feImage displacement map (rounded-rect distance field),
// three feDisplacementMaps at slightly different scales for chromatic edges.
// ============================================================================

  v.src = URL.createObjectURL(blob);
  await new Promise((res, rej) => { v.onloadeddata = res; v.onerror = rej; });
  wall.video = v;
}
function buildWall() {
  const root = el('div', 'scene', world); wall.root = root;
  wall.canvas = el('canvas', 'abs', root); wall.canvas.width = 1440; wall.canvas.height = 1440;
  wall.frame = el('div', 'abs', root, { background: '#0b0b0c' });
  wall.mat = el('div', 'abs', wall.frame, { background: '#f7f5f0', boxShadow: 'inset 0 2px 5px rgba(0,0,0,.28), inset 0 0 0 1px rgba(0,0,0,.18)', overflow: 'hidden' });
  wall.win = el('div', 'clip', wall.mat);
  wall.photo = photoImg('hero', wall.win);
  wall.bevel = el('div', 'abs', wall.mat, { boxShadow: 'inset 0 0 0 3px #fbfaf6, inset 0 0 0 4px rgba(0,0,0,.08)' });
  // the plant shadow falls on the mat and photo too (under the blades, so black stays black)
  wall.over = el('canvas', 'abs', wall.mat, { mixBlendMode: 'multiply' });
  wall.over.width = PR.w - 2 * PR.mold; wall.over.height = PR.h - 2 * PR.mold;
  wall.iris = new Iris(wall.mat, true);
}
function wallLevel() {
  const c = document.createElement('canvas'); c.width = 64; c.height = 64;
  const ctx = c.getContext('2d'); ctx.drawImage(wall.video, 0, 0, 1800, 600, 0, 0, 64, 64);
  const d = ctx.getImageData(0, 0, 64, 64).data; let s = 0;
  for (let i = 0; i < d.length; i += 4) s += 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2];
  return 255 / (s / (d.length / 4));
}
async function seekVideo(v, time) {
  const tt = clamp(time, 0, v.duration - 0.05);
  if (Math.abs(v.currentTime - tt) < 1e-4 && v.readyState >= 2) return;
  await new Promise(res => { v.onseeked = () => res(); v.currentTime = tt; });
}
async function updateWall(t) {
  await seekVideo(wall.video, 1.2 + (t - T.seg2));
  const ctx = wall.canvas.getContext('2d');
  ctx.drawImage(wall.video, 0, 0, 1440, 1440);
  const P = PR;
  // the black flood contracts into the frame, and later floods out of it
  const SPC = { w: 15, z: 0.9 }, SPF = { w: 16, z: 1 };
  const w = track(t, 3000, [[T.contract, P.w, SPC], [T.flood2, 3300, SPF]]);
  const h = track(t, 3000, [[T.contract, P.h, SPC], [T.flood2, 3300, SPF]]);
  const r = track(t, 1500, [[T.contract, 0, SPC]]);
  cbox(wall.frame, P.cx, P.cy, w, h, r);
  const sk = clamp(1 - (Math.max(w, h) - P.h) / 800);
  wall.frame.style.boxShadow = sk > 0 ? `0 ${30 * sk}px ${44 * sk}px rgba(46,38,26,${.30 * sk}), 0 ${8 * sk}px ${12 * sk}px rgba(46,38,26,${.22 * sk}), 0 1px 2px rgba(46,38,26,${.3 * sk})` : 'none';
  const inner = t >= T.contract + 0.5;
  show(wall.mat, inner);
  const mw = w - 2 * P.mold, mh = h - 2 * P.mold;
  box(wall.mat, P.mold, P.mold, mw, mh);
  const iw = mw - 2 * P.mat, ih = mh - 2 * P.mat;
  box(wall.win, P.mat, P.mat, iw, ih); placeCover(wall.photo, 'hero', 0, 0, iw, ih);
  box(wall.bevel, P.mat - 3, P.mat - 3, iw + 6, ih + 6);
  const a1 = Math.hypot(mw, mh) / 2 / Math.cos(Math.PI / 6) * 1.08;
  const aMax = Math.hypot(P.w - 2 * P.mold, P.h - 2 * P.mold) / 2 / Math.cos(Math.PI / 6) * 1.08;
  const a = track(t, 0, [[T.wallIris, aMax, SP.snap], [T.wallClose, 0, { w: 22, z: 0.92 }]]);
  wall.iris.set(mw, mh, a, 0.26 + 1.25 * (1 - clamp(a / aMax)), clamp(a / aMax));
  // the plant shadow falls across the print too: multiply the levelled footage over the mat
  const k = 1440 / 1800, OW = wall.over.width, OH = wall.over.height;
  const x = P.cx - w / 2 + P.mold, y = P.cy - h / 2 + P.mold;
  box(wall.over, 0, 0, mw, mh);
  const o = wall.over.getContext('2d');
  o.clearRect(0, 0, OW, OH);
  o.filter = `brightness(${wall.lev}) contrast(1.08)`;
  o.drawImage(wall.video, (x + 10) / k, (y - 14) / k, mw / k, mh / k, 0, 0, OW, OH);
  o.filter = 'none';
}

// ============================================================================
// camera and cursor: one continuous track per segment; segments meet under a full black flood
// ============================================================================
const FR = {};
function Wp(fr, x, y) { return [fr.ox + fr.k * x, fr.oy + fr.k * y]; }
function Wc(fr, x, y, s) { const [a, c] = Wp(fr, x, y); return [a, c, s / fr.k]; }
let CAM, CUR;
function buildTracks() {
  const d = open.dot, bc = open.bento.day, tc = open.tc;
  FR.world = { ox: 0, oy: 0, k: 1 };
  FR.glass = { ox: bc.x, oy: bc.y, k: bc.w / 1440 };
  FR.stage = { ox: FR.glass.ox + FR.glass.k * A.x, oy: FR.glass.oy + FR.glass.k * A.y, k: FR.glass.k * KS };
  const G = (x, y, s) => Wc(FR.glass, x, y, s), St = (x, y, s) => Wc(FR.stage, x, y, s);
  CAM = [
    { t0: 0, c0: [720, 720, 1], keys: [
      [T.squeeze, [d.cx, d.cy, 1.22], SP.cam],
      [T.irisClose, [d.cx, d.cy, 1.6], SP.soft],
      [T.shrink, [d.cx, d.cy, 1.42], SP.soft],
      [T.plus, [d.cx, d.cy, 1.27], SP.soft],
      [T.drop - 0.46, [tc.x, tc.y, 1440 / bc.w], landing(0.75, 0.46)],
      [T.bar, G(720, 1030, 1.4), { w: 7, z: 1 }],
      [T.slider, G(720, 720, 1), { w: 7, z: 1 }],
      [T.pullback, G(720, LOCK.y + LOCK.h / 2, 1320 / LOCK.h), { w: 6.5, z: 1 }],
      [T.phone, St(298, 724, 1.3), { w: 6.5, z: 1 }],
      [T.pinch, St(742, 700, 1.07), { w: 5.5, z: 1 }],
      [T.dropCard, St(MAC.x + MAC.w / 2, MAC.y + MAC.h / 2 + 10, 1.62), { w: 6, z: 1 }],
      [T.ordered, St(OC.x, OC.y, 1.95), { w: 7, z: 1 }],
      [T.way, St(OC.x, OC.y - 8, 1.75), { w: 8, z: 1 }],
    ] },
    { t0: T.seg2, c0: [720, 720, 1], keys: [[T.pushIn, [720, 650, 1.07], { w: 4, z: 1 }]] },
    { t0: T.seg3, c0: [d.cx, d.cy, 1.22], keys: [[T.letters - 0.55, [720, 720, 1], { w: 8.5, z: 1 }]] },
  ];
  const sl = SL, slotC = [PAGE.x + 400, PAGE.y + 56 + 72 + 150];
  const sw = stg.swatches[1], chip = stg.chips[1], os = stg.orderSlot;
  const pg = (x, y) => [PAGE.x + x, PAGE.y + 56 + y - SCROLL];
  CUR = [
    { t0: 0, fr: FR.world, base: 1, p0: [d.cx + 700, d.cy + 560], press: [[T.irisClose - 0.05, T.irisClose + 0.1], [T.tileClick - 0.05, T.tileClick + 0.06]], keys: [
      [b(2.6), [d.cx + 150, d.cy + 34], { w: 7.5, z: 1 }, { w: 9, z: 1 }],
      [T.irisOpen + 0.25, [d.cx + 330, d.cy + 300], { w: 6, z: 1 }],
      [b(8.8), [tc.x + 60, tc.y + 50], { w: 6.5, z: 1 }, { w: 7.5, z: 1 }],
      [T.tileClick + 0.12, [tc.x + 520, tc.y + 560], { w: 5, z: 1 }],
    ] },
    { t0: 6.3, fr: FR.glass, base: FR.glass.k, p0: [1680, 1560], press: [[T.adjust - 0.03, T.adjust + 0.08], [T.press - 0.02, T.release]], keys: [
      [T.bar - 0.15, [720 - 59 + 4, GL.barY + 8], { w: 7, z: 1 }, { w: 8, z: 1 }],
      [T.adjust + 0.25, [sl.t0 + 4, GL.barY + 6], { w: 7, z: 1 }],
      [T.drag, [sl.t1 + 4, GL.barY + 6], SP.drag],
      [T.release + 0.12, [1700, 1520], { w: 6, z: 1 }],
    ] },
    { t0: 11.2, fr: FR.stage, base: FR.stage.k, p0: [1700, 980], press: [[T.longpress, T.dropCard], [T.color - 0.03, T.color + 0.07], [T.size - 0.03, T.size + 0.07], [T.ordered - 0.03, T.ordered + 0.08]], keys: [
      [T.longpress - 0.52, [S.x + S.w / 2, S.y + S.h / 2 + 40], { w: 7, z: 1 }],
      [T.dragCard, [MAC.x + 312, MAC.y + 73], { w: 6.6, z: 1 }],
      [T.push + 0.1, slotC, { w: 8, z: 1 }],
      [T.scroll - 0.1, [slotC[0] + 20, slotC[1] + 30], { w: 9, z: 1 }],
      [T.color - 0.55, pg(sw.x, sw.y), { w: 8, z: 1 }],
      [T.size - 0.4, pg(chip.x + chip.w / 2, chip.y + chip.h / 2), { w: 8, z: 1 }],
      [T.buyFly + 0.1, pg(os.x + os.w / 2 + 40, os.y + os.h / 2 + 4), { w: 7, z: 1 }],
      [T.ordered + 0.18, [1560, 1150], { w: 5, z: 1 }],
    ] },
    { t0: T.seg2, fr: FR.world, base: 1, p0: [1700, 1650], press: [[T.wallIris - 0.03, T.wallIris + 0.07]], keys: [
      [T.contract + 0.1, [790, 700], { w: 7, z: 1 }],
      [T.wallIris + 0.2, [1700, 1500], { w: 4.5, z: 1 }],

}
function camAt(t) {
  let seg = CAM[0]; for (const s of CAM) if (t >= s.t0) seg = s;
  return camTrack(t, seg.c0, seg.keys);
}
let curSeg = null;
function cursorAt(t) {                  // in the current segment's own units
  let seg = CUR[0]; for (const s of CUR) if (t >= s.t0) seg = s;
  curSeg = seg;
  return track2(t, seg.p0, seg.keys);
}

// ============================================================================
// seek(t): every style is computed from time; nothing carries over between frames
// ============================================================================
async function seek(t) {
  t = clamp(t, 0, DURATION);
  pending = [];
  const openOn = t < 6.4 || t >= T.seg3;
  const glassOn = t >= T.drop && t < T.seg2;
  const wallOn = t >= T.seg2 && t < T.seg3;
  show(open.root, openOn);
  show(glass.root, glassOn);
  show(wall.root, wallOn);
  if (openOn) updateOpen(t);
  if (glassOn) { updateGlass(t); updateStage(t); }
  if (wallOn) await updateWall(t);
  let [cx, cy, cs] = camAt(t);
  if (Math.abs(cs - 1) < 1e-4 && Math.abs(cx - 720) < 0.02 && Math.abs(cy - 720) < 0.02) { cx = 720; cy = 720; cs = 1; }
  setCamera(cx, cy, cs);
  const p = cursorAt(t), seg = curSeg;
  const [wx, wy] = Wp(seg.fr, p[0], p[1]);
  setCursor(wx, wy, pressAmt(t, seg.press), seg.base);
  await Promise.all(pending);
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
}
window.seek = seek;
window.T = T;

window.filmReady = (async () => {
  await Promise.all([document.fonts.load('800 170px Archivo'), document.fonts.load('600 20px Geist'), document.fonts.load('800 150px Geist')]);
  await loadPhotos();
  await loadWall();
  buildOpen();
  buildGlass();
  buildStage();
  buildWall();
  buildTracks();
  world.appendChild(cursor);
  wall.lev = wallLevel();
  await Promise.all([...stg.clock.map(c => c.g.ready), ...glass.letters.map(l => l.g.ready)]);
  await seek(0);
})();
